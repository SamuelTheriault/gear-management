<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>RégiStock</title>
    <script>
      // Anti-flash (2026-08-02) : lit la préférence de thème AVANT le premier
      // rendu Vue, pour ne jamais afficher un sombre-qui-devient-clair (ou
      // l'inverse) au chargement — voir useTheme.js, même clé localStorage.
      try {
        var t = localStorage.getItem('registock-theme')
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
